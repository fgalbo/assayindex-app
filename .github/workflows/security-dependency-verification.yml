name: Temporary security dependency verification

on:
  push:
    branches: ["codex/security-dependency-updates"]
    paths: [".github/workflows/security-dependency-verification.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Resolve reviewed security updates without lifecycle scripts
        run: |
          cp package-lock.json /tmp/security-base-lock.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.dependencies.next = '16.4.1';
          p.devDependencies['eslint-config-next'] = '16.4.1';
          p.overrides = { ...p.overrides, undici: '6.29.1' };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Record package metadata and resolved lockfile delta
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const old = JSON.parse(fs.readFileSync('/tmp/security-base-lock.json', 'utf8'));
          const next = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const { packages, ...metadata } = next;
          const changed = Object.fromEntries(Object.entries(packages).filter(([key, value]) => JSON.stringify(value) !== JSON.stringify(old.packages[key])));
          const removed = Object.keys(old.packages).filter(key => !(key in packages));
          const delta = { metadata, changed, removed, package: JSON.parse(fs.readFileSync('package.json', 'utf8')) };
          console.log('SECURITY_LOCK_DELTA=' + JSON.stringify(delta));
          NODE
      - name: Install resolved dependencies
        run: npm ci --no-fund --no-audit
      - name: Run unit and acquisition tests
        run: |
          npm run test:assayindex-acquisition
          npm test
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
