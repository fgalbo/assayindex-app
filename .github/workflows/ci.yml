name: AssayIndex CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:public-export
      - run: npm run test:assayindex-acquisition
      - run: npm test -- tests/assayindex
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
